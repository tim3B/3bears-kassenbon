[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # public/config.js intentionally contains the PUBLIC Supabase URL + anon key
  # (safe in the browser; RLS + Entra protect the data). Exclude it from secret
  # scanning so those public values don't fail the build. The service_role key is
  # NEVER in the repo — only a Netlify env var — so it stays covered by scanning.
  SECRETS_SCAN_OMIT_PATHS = "public/config.js"
  # SUPABASE_URL and ANTHROPIC_MODEL are not secrets (project ref / model name,
  # both safe to expose) but ARE Netlify env vars, so their literal values get
  # flagged by the generic secrets scanner wherever docs mention them (README,
  # MAINTENANCE.md). Every deploy since 03.07.2026 has silently failed on this.
  # ANTHROPIC_API_KEY and SUPABASE_SERVICE_ROLE stay fully scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,ANTHROPIC_MODEL"

[functions]
  node_bundler = "esbuild"

# SPA-ish: serve the app for any path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
